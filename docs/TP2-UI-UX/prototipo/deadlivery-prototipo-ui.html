<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeadLivery Prototipo UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14081e; --paper:#f3f0f7; --violet:#1a1033; --violet2:#2a1b4d; --magenta:#ee21b8;
  --amber:#ffd60a; --alert:#f0261f; --ok:#78dc78; --mute:#8b7fa3;
  --txt:1;
  --display:"Special Elite","Courier New",monospace;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07030f;overflow:hidden;font-family:var(--body);color:var(--paper)}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1920px;height:1080px;transform-origin:center center;flex:none;overflow:hidden;background:#000}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
img{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:4px solid var(--amber);outline-offset:3px}

/* ---------- Pantalla 1: gameplay + HUD ---------- */
#bg{position:absolute;inset:0;width:1920px;height:1080px}
.hud{position:absolute}
.ring{position:absolute;width:94px;height:94px}
.ring svg{position:absolute;inset:0;width:94px;height:94px;transform:rotate(-90deg)}
.ring .icon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:42px}
.ring .track{fill:rgba(8,3,20,.8);stroke:rgba(255,255,255,.18);stroke-width:12}
.ring .fill{fill:none;stroke-width:12;stroke-linecap:butt;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .3s}
.ring.low{animation:blink .66s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.reduce-motion .ring.low{animation:none}
.label{position:absolute;height:12px}
.num{position:absolute;display:flex;gap:2px}
.num img{height:34px}
.num.sm img{height:22px}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.dim{opacity:.35}
#warnTri{position:absolute;left:150px;top:62px;width:34px;height:34px;display:none}
.daltonico #warnTri.on{display:block}
.daltonico .ring.low .fill{stroke-dasharray:6 4 !important}

#track{position:absolute;left:600px;top:940px;width:720px;height:110px}
#track .line{position:absolute;left:24px;top:72px;width:672px;height:10px;background:#08020f;border-radius:5px}
#track .done{position:absolute;left:24px;top:74px;height:6px;background:var(--magenta);border-radius:3px;width:80px;transition:width 1s}
#track .node{position:absolute;top:63px;width:24px;height:24px;border-radius:50%;background:#08020f;border:3px solid #fff;box-sizing:border-box}
#track .node.on{background:var(--magenta)}
#track .flag{position:absolute;left:690px;top:22px;height:50px}
#track .me{position:absolute;top:18px;height:54px;transition:left 1s}

/* objeto interactivo */
#bidon{position:absolute;left:760px;top:760px;width:120px;height:120px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:rgba(238,33,184,.18);border:3px dashed var(--magenta);
  animation:halo 1.4s ease-in-out infinite}
#bidon img{height:84px;filter:drop-shadow(0 4px 6px #000)}
@keyframes halo{50%{box-shadow:0 0 0 18px rgba(238,33,184,.0),0 0 40px 8px rgba(238,33,184,.55)}}
.reduce-motion #bidon{animation:none;box-shadow:0 0 30px 6px rgba(238,33,184,.5)}
#bidonTip{position:absolute;left:700px;top:700px;width:240px;text-align:center;font:700 26px var(--body);text-shadow:0 2px 6px #000}

/* boton de garaje en el HUD */
#btnGaraje{position:absolute;right:48px;top:48px}

/* ---------- botones con la forma del menu del juego ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  font-family:var(--display);font-size:calc(34px*var(--txt));letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink);padding:16px 54px;min-width:300px;
  background:var(--paper);clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);
  transition:transform .12s, filter .12s}
.btn::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(20,8,30,.16) 5px 6px);opacity:0;transition:opacity .12s}
.btn:hover,.btn.sel{background:#d7d2e0;transform:translateX(6px)}
.btn:hover::before,.btn.sel::before{opacity:1}
.btn:active{transform:translateX(6px) scale(.97)}
.btn.primary{background:var(--magenta);color:#fff}
.btn.primary:hover{background:#ff3fcc}
.btn.small{font-size:calc(26px*var(--txt));padding:12px 38px;min-width:0}
.btn[disabled],.btn.off{cursor:not-allowed;background:#3a3050;color:#8b7fa3;transform:none;pointer-events:auto}
.btn[disabled]::before,.btn.off::before{opacity:.5;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.06) 8px 16px)}
.btn.done{background:var(--ok);color:var(--ink)}
.kbd{font:700 calc(20px*var(--txt)) var(--body);border:2px solid currentColor;border-radius:6px;padding:0 8px}

/* ---------- Pop-up tutorial ---------- */
#frame{position:absolute;left:69px;top:46px;width:118px;height:118px;border:6px solid var(--amber);border-radius:14px;animation:fr .5s steps(1) infinite;pointer-events:none}
@keyframes fr{50%{opacity:.35}}
.reduce-motion #frame{animation:none}
#tuto{position:absolute;left:500px;top:780px;width:920px;padding:26px 34px 28px;background:rgba(14,6,30,.94);
  border:4px solid var(--magenta);border-radius:18px;box-shadow:0 12px 50px rgba(0,0,0,.6);
  animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.reduce-motion #tuto{animation:none}
#tuto .step{font:700 calc(24px*var(--txt)) var(--body);letter-spacing:.14em;color:var(--magenta)}
#tuto h2{font:700 calc(46px*var(--txt))/1.15 var(--body);margin:6px 0 4px}
#tuto p{font-size:calc(26px*var(--txt));color:#d9d0ea;line-height:1.35}
#tuto .row{display:flex;gap:18px;justify-content:flex-end;margin-top:18px;align-items:center}
#tuto .dots{margin-right:auto;display:flex;gap:8px}
#tuto .dots i{width:14px;height:14px;border-radius:50%;background:#46385f}
#tuto .dots i.on{background:var(--magenta)}
#float{position:absolute;left:180px;top:130px;font:700 40px var(--body);color:var(--ok);text-shadow:0 3px 8px #000;opacity:0}
#float.go{animation:fl 1.6s ease-out}
@keyframes fl{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
#toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(14,6,30,.95);border:3px solid var(--amber);
  padding:12px 26px;border-radius:12px;font:700 calc(26px*var(--txt)) var(--body);opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}

/* ---------- Pantalla 2: Garaje ---------- */
#garage{background:linear-gradient(120deg,#2a1b4d 0%,#1a1033 45%,#0a0716 100%)}
#garage::before{content:"";position:absolute;inset:0;background:
  linear-gradient(115deg,transparent 0 30%,rgba(255,255,255,.04) 30% 52%,transparent 52%),
  linear-gradient(65deg,transparent 0 62%,rgba(238,33,184,.06) 62% 74%,transparent 74%)}
#garage.in{animation:gin .28s ease-out}
@keyframes gin{from{opacity:0;transform:translateX(40px)}}
.reduce-motion #garage.in{animation:none}
#garage header{position:absolute;left:90px;top:50px;right:90px;display:flex;align-items:flex-end;justify-content:space-between}
#garage h1{font:400 calc(78px*var(--txt))/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
#garage h1 small{display:block;font:600 calc(24px*var(--txt)) var(--body);letter-spacing:.18em;color:var(--magenta);margin-bottom:8px}
#tabs{position:absolute;left:90px;top:190px;display:flex;gap:8px}
.tab{position:relative;font-family:var(--display);font-size:calc(32px*var(--txt));text-transform:uppercase;padding:14px 46px 16px;
  color:var(--mute);background:rgba(255,255,255,.05);clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);transition:.15s}
.tab:hover{color:var(--paper);background:rgba(255,255,255,.12)}
.tab[aria-selected="true"]{background:var(--paper);color:var(--ink)}
.tab .cnt{font:700 20px var(--body);margin-left:10px;color:var(--magenta)}
.hint{font:600 calc(20px*var(--txt)) var(--body);color:var(--mute);margin:0 0 0 14px;align-self:center}
#list{position:absolute;left:90px;top:272px;width:760px;display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:22px;text-align:left;width:100%;padding:14px 22px;border-radius:10px;
  background:rgba(255,255,255,.06);border:3px solid transparent;transition:.12s}
.item:hover{background:rgba(255,255,255,.12)}
.item[aria-selected="true"]{background:rgba(238,33,184,.16);border-color:var(--magenta);transform:translateX(8px)}
.item .ico{flex:none;width:84px;height:84px;border-radius:12px;background:rgba(8,3,20,.7);display:flex;align-items:center;justify-content:center}
.item .ico img,.item .ico svg{height:52px;max-width:60px;width:auto}
.item .nm{font:700 calc(32px*var(--txt)) var(--body);display:block}
.item .sb{font:400 calc(22px*var(--txt)) var(--body);color:#bfb4d4}
.chip{margin-left:auto;font:700 calc(20px*var(--txt)) var(--body);letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border-radius:99px;white-space:nowrap}
.chip.eq{background:var(--ok);color:var(--ink)}
.chip.lock{background:#3a3050;color:#b7a9d3}
.chip.ok{background:transparent;border:2px solid #6d5f8a;color:#cfc4e6}
#detail{position:absolute;left:940px;top:190px;width:890px;height:700px;padding:42px 46px;border-radius:18px;
  background:rgba(8,3,20,.66);border:3px solid rgba(255,255,255,.14)}
#detail .big{display:flex;align-items:center;gap:34px}
#detail .bigico{flex:none;width:190px;height:190px;border-radius:18px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center}
#detail .bigico img,#detail .bigico svg{height:120px;max-width:130px;width:auto}
#detail h2{font:400 calc(54px*var(--txt))/1.05 var(--display);text-transform:uppercase}
#detail .tag{font:700 calc(22px*var(--txt)) var(--body);letter-spacing:.14em;color:var(--magenta);margin-bottom:6px}
#detail .desc{margin:26px 0 22px;font-size:calc(27px*var(--txt));line-height:1.4;color:#e3dbf2}
.stat{display:grid;grid-template-columns:200px 1fr 130px;gap:16px;align-items:center;margin:14px 0;font-size:calc(24px*var(--txt))}
.stat .bar{height:18px;border-radius:9px;background:#2a1f3f;position:relative;overflow:hidden}
.stat .bar i{position:absolute;left:0;top:0;bottom:0;background:#7a6e96;transition:width .35s}
.stat .bar b{position:absolute;left:0;top:0;bottom:0;background:var(--ok);opacity:.95;transition:width .35s}
.stat .bar b.neg{background:var(--alert)}
.stat .val{font-weight:700;text-align:right}
.val.up{color:var(--ok)}.val.dn{color:#ff7b73}
.daltonico .val.up::before{content:"▲ "}.daltonico .val.dn::before{content:"▼ "}
#actions{position:absolute;left:46px;right:46px;bottom:38px;display:flex;align-items:center;gap:26px}
#reason{font:600 calc(22px*var(--txt)) var(--body);color:#cfc4e6}
#garage footer{position:absolute;left:90px;right:90px;bottom:44px;display:flex;align-items:center;justify-content:space-between}
.acc{display:flex;gap:12px;align-items:center;font:600 20px var(--body);color:var(--mute)}
.tog{border:2px solid #6d5f8a;border-radius:99px;padding:8px 18px;font:600 calc(20px*var(--txt)) var(--body);color:#cfc4e6}
.tog[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tog[aria-pressed="true"]::before{content:"✓ "}
#snd{position:absolute;right:20px;bottom:12px;font:600 18px var(--body);color:#6d5f8a}
</style>
</head>

<script>
/* ===== escala del escenario 1920x1080 a la ventana ===== */
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
const $=id=>document.getElementById(id);

/* ===== sonido sintetizado (la UI del juego tiene sus propios sonidos) ===== */
let actx=null,sndOn=true;
function tone(f,d,type='square',vol=.06,slide=0,delay=0){
  if(!sndOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const t=actx.currentTime+delay,o=actx.createOscillator(),g=actx.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  move:()=>tone(520,.06,'square',.04),
  tab:()=>tone(380,.09,'triangle',.07,120),
  confirm:()=>{tone(440,.08,'square',.06);tone(660,.12,'square',.06,0,.07)},
  equip:()=>{tone(330,.07,'sawtooth',.05);tone(495,.07,'sawtooth',.05,0,.07);tone(740,.16,'square',.06,0,.14)},
  denied:()=>tone(150,.2,'sawtooth',.07,-60),
  back:()=>tone(520,.12,'triangle',.06,-220),
  pop:()=>{tone(300,.12,'sine',.1,500)},
  open:()=>tone(260,.18,'triangle',.07,300)
};

/* ===== HUD ===== */
const R=41,C=2*Math.PI*R;
const state={nafta:.18,bat:.62,avance:.12,balas:5,gr:2,c4:1};
const digs=n=>String(Math.max(0,Math.min(99,n))).padStart(2,'0').split('');
function setNum(id,n,pop){
  const el=$(id);el.innerHTML=digs(n).map(d=>'<img src="'+DIG[d]+'" alt="">').join('');
  if(pop){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
}
function ring(fillId,ringId,frac){
  const f=$(fillId);f.style.strokeDasharray=C;f.style.strokeDashoffset=C*(1-frac);
  const low=frac<=.2;
  const col=low?'#f0261f':frac<.5?'#ffd23f':'#78dc78';
  f.setAttribute('stroke',col);
  $(ringId).classList.toggle('low',low);
}
function drawHud(){
  ring('fNafta','ringNafta',state.nafta);ring('fBat','ringBat',state.bat);
  $('warnTri').classList.toggle('on',state.nafta<=.2);
  setNum('nBalas',state.balas);setNum('nMax',5);setNum('nGr',state.gr);setNum('nC4',state.c4);
  $('done').style.width=(672*state.avance)+'px';$('me').style.left=(24+672*state.avance-32)+'px';
}

/* ===== flujo: gameplay -> tutorial -> garaje -> gameplay ===== */
let tutoVisto=false,mode='game';
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function showTuto(){
  $('tuto').classList.remove('hidden');$('frame').classList.remove('hidden');$('bidonTip').classList.add('hidden');
  sfx.open();$('btnOk').focus();
}
function closeTuto(recoger){
  $('tuto').classList.add('hidden');$('frame').classList.add('hidden');
  if(recoger){
    tutoVisto=true;sfx.pop();$('bidon').classList.add('hidden');
    state.nafta=.8;state.avance=.2;drawHud();
    const f=$('float');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
    $('ringNafta').classList.remove('pop');void $('ringNafta').offsetWidth;$('ringNafta').classList.add('pop');
    toast('Tip: el garaje (G) se abre cuando quieras.');
  }
}
$('bidon').onclick=()=>{ if(!tutoVisto) showTuto(); };
$('btnOk').onclick=()=>{sfx.confirm();closeTuto(true)};
$('btnToGarage').onclick=()=>{sfx.confirm();closeTuto(true);openGarage()};
$('btnGaraje').onclick=()=>{sfx.confirm();openGarage()};

const im=k=>'<img src="'+IMG[k]+'" alt="">';
const DATA=[
 {id:'moto',name:'Moto',slot:'Equipo de la Vespa',items:[
  {id:'t0',name:'Tanque estándar',sub:'El de fábrica',ico:im('nafta'),tag:'TANQUE',desc:'El tanque con el que sale la Vespa del taller. Alcanza para un tramo corto si no abusás del turbo.',stats:[['Capacidad',60,60,'100 %'],['Consumo',50,50,'×1,0']],lock:null},
  {id:'t1',name:'Tanque extra',sub:'+25 % de capacidad',ico:im('nafta'),tag:'TANQUE',desc:'Un bidón soldado al chasis. Más metros entre cargas, pero pesa: el turbo gasta un poco más.',stats:[['Capacidad',60,85,'+25 %'],['Consumo',50,58,'+10 %',true]],lock:null},
  {id:'f1',name:'Faro LED',sub:'La batería dura más',ico:SVG.faro,tag:'FARO',desc:'Mismo haz, menos consumo. La horda sigue frenándose a la mitad de velocidad dentro del cono de luz.',stats:[['Duración de batería',55,80,'+30 %'],['Alcance del haz',50,50,'=']],lock:null},
  {id:'f2',name:'Faro de largo alcance',sub:'Se ve más lejos',ico:SVG.faro,tag:'FARO',desc:'Ilumina el carril de adelante con anticipación. Ideal para tramos con apagón.',stats:[['Alcance del haz',50,90,'+40 %'],['Duración de batería',55,45,'−10 %',true]],lock:'Se desbloquea al terminar el Nivel 2'}]},
 {id:'arse',name:'Arsenal',slot:'Equipo de combate',items:[
  {id:'a0',name:'Pistola',sub:'5 balas',ico:im('bala'),tag:'ARMA',desc:'Dispara hacia atrás por tu carril. Empuja a la horda, no la detiene. Munición limitada.',stats:[['Munición',50,50,'5'],['Cadencia',50,50,'Media']],lock:null},
  {id:'a1',name:'Cargador extendido',sub:'+2 balas',ico:im('bala'),tag:'ARMA',desc:'Dos balas más antes de quedarte sin nada. El tiempo de recarga no cambia.',stats:[['Munición',50,70,'+2'],['Cadencia',50,50,'=']],lock:null},
  {id:'g0',name:'Granada',sub:'Hasta 3',ico:im('gr'),tag:'SECUNDARIA',desc:'Se lanza hacia atrás y explota a 10 m: elimina a todos los carriles y la horda tarda 5 s en reponerse.',stats:[['Radio',50,50,'8 m'],['Cantidad',40,40,'3']],lock:null},
  {id:'c0',name:'Bomba C4',sub:'Solo a pie',ico:im('c4'),tag:'SECUNDARIA',desc:'Mecha de 2 s. Mata a todo el que pelea a tu alrededor, pero no frena la oleada. Usala al final.',stats:[['Radio',60,60,'Área'],['Cantidad',30,30,'2']],lock:'Se desbloquea tras la primera pelea a pie'}]},
 {id:'pedido',name:'Pedido',slot:'Lo que llevás en la caja',items:[
  {id:'p0',name:'Empanadas',sub:'Aguantan el viaje',ico:SVG.empanada,tag:'PEDIDO',desc:'Se enfrían despacio. La opción tranquila para cualquier ruta.',stats:[['Se enfría en',60,60,'120 s'],['Propina',40,40,'Normal']],lock:null},
  {id:'p1',name:'Pizza',sub:'Más propina, más riesgo',ico:SVG.pizza,tag:'PEDIDO',desc:'Paga mejor, pero si se enfría el cliente se queja. Cada choque la mueve de lugar.',stats:[['Se enfría en',60,45,'90 s',true],['Propina',40,70,'+50 %']],lock:null},
  {id:'p2',name:'Helado',sub:'Se derrite rápido',ico:SVG.helado,tag:'PEDIDO',desc:'La mejor propina del juego, con un reloj que no perdona. Solo para quien domina los carriles.',stats:[['Se enfría en',60,25,'45 s',true],['Propina',40,95,'+120 %']],lock:'Se desbloquea al sacar nota A en el Nivel 1'},
  {id:'p3',name:'Sopa caliente',sub:'No se enfría, pesa',ico:SVG.sopa,tag:'PEDIDO',desc:'Mantiene el calor todo el viaje, pero la caja es incómoda: cuesta más recuperarse de un salto.',stats:[['Se enfría en',60,90,'180 s'],['Estabilidad',50,38,'−25 %',true]],lock:null}]}
];
/* equipado por categoria + seleccion */
const equipped={moto:['t0','f1'],arse:['a0','g0'],pedido:['p0']};
let tab=0,sel=0;
const bySlot=(c,it)=>c.id==='moto'?it.id[0]:c.id==='arse'?(it.id[0]==='a'?'a':'s'):'p';
function equippedOf(c){return equipped[c.id]}
function isEq(c,it){return equippedOf(c).includes(it.id)}

function renderTabs(){
  $('tabs').innerHTML=DATA.map((c,i)=>'<button class="tab" role="tab" aria-selected="'+(i===tab)+'" data-i="'+i+'">'+c.name+'<span class="cnt">'+c.items.filter(x=>!x.lock).length+'/'+c.items.length+'</span></button>').join('')+'<span class="hint"><span class="kbd">Q</span><span class="kbd">E</span></span>';
  $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(+b.dataset.i));
}
function renderList(){
  const c=DATA[tab];
  $('list').innerHTML=c.items.map((it,i)=>{
    const eq=isEq(c,it);
    const chip=eq?'<span class="chip eq">'+(document.body.classList.contains('daltonico')?'✔ ':'')+'Equipado</span>':it.lock?'<span class="chip lock">🔒 Bloqueado</span>':'<span class="chip ok">Disponible</span>';
    return '<button class="item" role="option" aria-selected="'+(i===sel)+'" data-i="'+i+'"><span class="ico">'+it.ico+'</span><span><span class="nm">'+it.name+'</span><span class="sb">'+it.sub+'</span></span>'+chip+'</button>';
  }).join('');
  $('list').querySelectorAll('.item').forEach(b=>{b.onclick=()=>setSel(+b.dataset.i);b.ondblclick=()=>equip()});
}
function renderDetail(){
  const c=DATA[tab],it=c.items[sel],eq=isEq(c,it);
  let label,cls='btn primary',dis=false,reason='';
  if(it.lock){label='Bloqueado';cls='btn off';dis=true;reason='🔒 '+it.lock}
  else if(eq){label='Equipado ✓';cls='btn done';dis=true;reason='Ya lo tenés puesto.'}
  else{label='Equipar';reason='Reemplaza lo que llevás en este espacio.'}
  const stats=it.stats.map(s=>{
    const [n,a,b,v,neg]=s;const d=b-a;
    return '<div class="stat"><span>'+n+'</span><div class="bar"><i style="width:'+Math.min(a,b)+'%"></i><b class="'+((d<0)||neg?'neg':'')+'" style="left:'+Math.min(a,b)+'%;width:'+Math.abs(d)+'%"></b></div><span class="val '+(d===0?'':(neg?'dn':(d>0?'up':'dn')))+'">'+v+'</span></div>';
  }).join('');
  $('detail').innerHTML='<div class="big"><div class="bigico">'+it.ico+'</div><div><div class="tag">'+it.tag+' · '+c.slot.toUpperCase()+'</div><h2>'+it.name+'</h2></div></div>'+
   '<p class="desc">'+it.desc+'</p>'+stats+
   '<div id="actions"><button class="'+cls+'" id="btnEquip" '+(dis?'aria-disabled="true"':'')+'>'+label+'</button><span id="reason">'+reason+'</span></div>';
  $('btnEquip').onclick=equip;
}
function firstFree(){const c=DATA[tab];const i=c.items.findIndex(it=>!it.lock&&!isEq(c,it));return i<0?0:i}
function setTab(i){tab=(i+DATA.length)%DATA.length;sel=firstFree();sfx.tab();renderAll()}
function setSel(i){const n=DATA[tab].items.length;sel=(i+n)%n;sfx.move();renderList();renderDetail()}
function equip(){
  const c=DATA[tab],it=c.items[sel];
  if(it.lock||isEq(c,it)){sfx.denied();const b=$('btnEquip');b.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:220});return}
  const list=equippedOf(c);
  const k=bySlot(c,it);
  const idx=list.findIndex(id=>bySlot(c,{id})===k);
  if(idx>=0)list[idx]=it.id;else list.push(it.id);
  sfx.equip();renderList();renderDetail();toast(it.name+' equipado');
}
function renderAll(){renderTabs();renderList();renderDetail()}

function openGarage(){
  mode='garage';$('game').classList.add('hidden');$('garage').classList.remove('hidden');
  $('garage').classList.remove('in');void $('garage').offsetWidth;$('garage').classList.add('in');
  if(!openGarage.keep)sel=firstFree();openGarage.keep=false;
  renderAll();sfx.open();
}
function backToGame(){
  mode='game';sfx.back();$('garage').classList.add('hidden');$('game').classList.remove('hidden');
  toast('Vuelta al juego');
}
$('btnBack').onclick=backToGame;
addEventListener('keydown',e=>{
  if(mode==='garage'){
    if(e.key==='Escape'){backToGame();e.preventDefault()}
    else if(e.key==='ArrowDown'){setSel(sel+1);e.preventDefault()}
    else if(e.key==='ArrowUp'){setSel(sel-1);e.preventDefault()}
    else if(e.key==='ArrowRight'||e.key.toLowerCase()==='e'){setTab(tab+1);e.preventDefault()}
    else if(e.key==='ArrowLeft'||e.key.toLowerCase()==='q'){setTab(tab-1);e.preventDefault()}
    else if(e.key==='Enter'&&document.activeElement.tagName!=='BUTTON'||(e.key==='Enter'&&document.activeElement.classList.contains('item'))){equip();e.preventDefault()}
  }else{
    if(e.key.toLowerCase()==='g'&&$('tuto').classList.contains('hidden')){sfx.confirm();openGarage()}
    if(e.key==='Escape'&&!$('tuto').classList.contains('hidden')){closeTuto(false)}
  }
});

/* ===== accesibilidad ===== */
function tog(id,fn){const b=$(id);b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);sfx.confirm();renderAll()}}
tog('tTxt',on=>document.documentElement.style.setProperty('--txt',on?1.25:1));
tog('tDal',on=>{document.body.classList.toggle('daltonico',on);drawHud()});
tog('tMov',on=>document.body.classList.toggle('reduce-motion',on));
tog('tSnd',on=>{sndOn=on});
$('tSnd').onclick=(()=>{const b=$('tSnd');return()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);sndOn=on;if(on)sfx.confirm();}})();

drawHud();
/* atajos para capturas: #juego, #tutorial, #garaje/pestaña/ítem */
{const h=location.hash.slice(1).split('/');
 if(h[0]==='tutorial'){state.nafta=.18;drawHud();showTuto()}
 if(h[0]==='garaje'){tutoVisto=true;$('bidon').classList.add('hidden');$('bidonTip').classList.add('hidden');state.nafta=.8;state.avance=.2;drawHud();tab=+h[1]||0;sel=+(h[2]||0);openGarage.keep=true;openGarage();}
}
</script>
